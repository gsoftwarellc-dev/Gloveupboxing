name: Deploy Frontend and Backend to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IONOS_BACKEND_TARGET: /home/www/clickandbuilds/BackfillConstructionRecruitment/backend
      IONOS_HOST: access-5020603051.webspace-host.com
      IONOS_TARGET: /home/www/clickandbuilds/BackfillConstructionRecruitment
      IONOS_USERNAME: su266029
      SITE_URL: https://www.backfillconstruction.co.uk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend/laravel
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-scripts

      - name: Install SSH deploy tools
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Normalize deploy settings
        id: deploy
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$IONOS_HOST" | tr -d '\r\n')"
          USERNAME="$(printf '%s' "$IONOS_USERNAME" | tr -d '\r\n')"
          TARGET="$(printf '%s' "$IONOS_TARGET" | tr -d '\r\n')"
          PASSWORD="$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')"
          PASSWORD_FILE="$RUNNER_TEMP/ionos-password"

          if [ -z "$HOST" ] || [ -z "$USERNAME" ] || [ -z "$TARGET" ] || [ -z "$PASSWORD" ]; then
            echo "Missing the required deploy password secret: FTP_PASSWORD."
            exit 1
          fi

          printf '%s' "$PASSWORD" > "$PASSWORD_FILE"
          chmod 600 "$PASSWORD_FILE"

          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "password_file=$PASSWORD_FILE" >> "$GITHUB_OUTPUT"

      - name: Prepare remote directories
        run: |
          sshpass -f "${{ steps.deploy.outputs.password_file }}" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 22 \
            "${{ steps.deploy.outputs.username }}@${{ steps.deploy.outputs.host }}" "
            set -e
            mkdir -p '${{ steps.deploy.outputs.target }}'
            mkdir -p '${{ env.IONOS_BACKEND_TARGET }}'
            mkdir -p '${{ env.IONOS_BACKEND_TARGET }}/laravel'
          "

      - name: Deploy frontend build to IONOS
        run: |
          sshpass -f "${{ steps.deploy.outputs.password_file }}" rsync -az --delete \
            --exclude 'backend' \
            --exclude '.htaccess' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22" \
            dist/ "${{ steps.deploy.outputs.username }}@${{ steps.deploy.outputs.host }}:${{ steps.deploy.outputs.target }}/"

      - name: Deploy root htaccess to IONOS
        run: |
          sshpass -f "${{ steps.deploy.outputs.password_file }}" rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22" \
            ./.htaccess "${{ steps.deploy.outputs.username }}@${{ steps.deploy.outputs.host }}:${{ steps.deploy.outputs.target }}/.htaccess"

      - name: Deploy backend routing files to IONOS
        run: |
          sshpass -f "${{ steps.deploy.outputs.password_file }}" rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22" \
            ./backend/root/index.php "${{ steps.deploy.outputs.username }}@${{ steps.deploy.outputs.host }}:${{ env.IONOS_BACKEND_TARGET }}/index.php"
          sshpass -f "${{ steps.deploy.outputs.password_file }}" rsync -az \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22" \
            ./backend/root/.htaccess "${{ steps.deploy.outputs.username }}@${{ steps.deploy.outputs.host }}:${{ env.IONOS_BACKEND_TARGET }}/.htaccess"

      - name: Deploy Laravel app to IONOS
        run: |
          sshpass -f "${{ steps.deploy.outputs.password_file }}" rsync -az --delete \
            --exclude '.env' \
            --exclude 'storage/' \
            --exclude 'bootstrap/cache/*.php' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22" \
            ./backend/laravel/ "${{ steps.deploy.outputs.username }}@${{ steps.deploy.outputs.host }}:${{ env.IONOS_BACKEND_TARGET }}/laravel/"

      - name: Prepare Laravel runtime and refresh caches
        run: |
          sshpass -f "${{ steps.deploy.outputs.password_file }}" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 22 \
            "${{ steps.deploy.outputs.username }}@${{ steps.deploy.outputs.host }}" "
            set -e
            APP_PATH='${{ env.IONOS_BACKEND_TARGET }}/laravel'
            mkdir -p \"\$APP_PATH/storage/framework/views\"
            mkdir -p \"\$APP_PATH/storage/framework/cache\"
            mkdir -p \"\$APP_PATH/storage/framework/sessions\"
            mkdir -p \"\$APP_PATH/storage/logs\"
            mkdir -p \"\$APP_PATH/bootstrap/cache\"
            if [ ! -f \"\$APP_PATH/.env\" ]; then
              echo \"Missing production .env at \$APP_PATH/.env\"
              exit 1
            fi
            rm -f \"\$APP_PATH/bootstrap/cache/\"*.php
            cd \"\$APP_PATH\"
            php8.3 artisan optimize:clear
            php8.3 artisan config:cache
            php8.3 artisan route:cache
            php8.3 artisan view:cache
          "

      - name: Smoke test production
        run: |
          set -euo pipefail
          health=''

          for attempt in 1 2 3 4 5 6; do
            health="$(curl --silent --show-error --fail "$SITE_URL/backend/api/health" || true)"

            if curl --silent --show-error --fail --head "$SITE_URL" >/dev/null \
              && printf '%s' "$health" | grep -F '"app":"Bravo CRM API"' >/dev/null; then
              exit 0
            fi

            if [ "$attempt" -lt 6 ]; then
              sleep 5
            fi
          done

          echo "Production smoke test did not confirm the Bravo deployment."
          echo "Last health response: ${health:-<empty>}"
          exit 1

      - name: Remove deploy password file
        if: always()
        run: rm -f "${{ steps.deploy.outputs.password_file }}"
